# Común a todos los perfiles
spring.application.name=orlo-api
spring.profiles.default=dev
server.port=${PORT:8090}
# Secretos de desarrollo en backend/.env (no se sube; ver .env.example). En producción no existe y todo llega por variables
spring.config.import=optional:file:.env[.properties]
# Detrás del proxy del hosting: respeta X-Forwarded-* (https y la IP real)
server.forward-headers-strategy=framework
# Actuator: solo /actuator/health, sin detalles
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
spring.jackson.serialization.write-dates-as-timestamps=false
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.expiration-ms=1800000
app.ai.timeout-seconds=30
app.premium.free-gallery-size=6
app.admin.email=admin@orlo.co
app.advisor.daily-outfit-limit=3
app.fcm.topic-lessons=lecciones
#---
spring.config.activate.on-profile=dev
# Desarrollo: PostgreSQL en Docker y emulador de Firebase
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/orlo}
spring.datasource.username=${DB_USER:orlo}
spring.datasource.password=${DB_PASSWORD:orlo_dev}
app.jwt.secret=${ORLO_JWT_SECRET}
app.cors.allowed-origins=${ORLO_CORS_ORIGINS:http://localhost:4200}
app.firebase.project-id=${ORLO_FIREBASE_PROJECT_ID:demo-orlo}
app.firebase.auth-emulator-host=${FIREBASE_AUTH_EMULATOR_HOST:localhost:9099}
app.ai.api-key=${ORLO_ANTHROPIC_API_KEY:}
app.admin.password=${ORLO_ADMIN_PASSWORD}
# Todo desbloqueado mientras se prueba: /me responde premium a todos
app.premium.for-everyone=${ORLO_PREMIUM_PARA_TODOS:true}
# Sin proyecto real de Firebase no hay FCM: se registra en el log lo que se enviaria
app.fcm.enabled=${ORLO_FCM_ENABLED:false}
#---
spring.config.activate.on-profile=prod
# Producción: todo por variables de entorno (en Render, docker-entrypoint.sh pasa DATABASE_URL a formato JDBC)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${ORLO_JWT_SECRET}
app.cors.allowed-origins=${ORLO_CORS_ORIGINS}
app.firebase.project-id=${ORLO_FIREBASE_PROJECT_ID}
app.firebase.auth-emulator-host=
app.ai.api-key=${ORLO_ANTHROPIC_API_KEY}
app.admin.password=${ORLO_ADMIN_PASSWORD}
app.premium.for-everyone=${ORLO_PREMIUM_PARA_TODOS:false}
app.fcm.enabled=${ORLO_FCM_ENABLED:true}
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
# Dimensionados para la máquina de producción (plan gratis: 0,1 CPU y 512 MB)
server.tomcat.threads.max=${THREADS:50}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}
#---
