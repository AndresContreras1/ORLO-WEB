<div class="d-flex align-items-center justify-content-between mb-4">
  <h1 class="page-title">Resumen</h1>
  <button type="button" class="btn btn-outline-secondary btn-sm" (click)="cargar()">
    <i class="bi bi-arrow-clockwise me-1"></i>Actualizar
  </button>
</div>

<app-load-state [loading]="cargando()" [error]="error()" (retry)="cargar()" />

@if (!cargando() && !error()) {
  <div class="row g-3">
    @for (t of tarjetas(); track t.label) {
      <div class="col-12 col-sm-6 col-xl-4">
        <div class="card border-0 h-100">
          <div class="card-body d-flex gap-3 align-items-start">
            <div class="bg-accent-soft text-accent rounded-3 p-2 lh-1"><i class="bi {{ t.icon }} fs-4"></i></div>
            <div>
              <div class="text-secondary small">{{ t.label }}</div>
              <div class="fs-3 fw-bold metric-value">{{ t.value }}</div>
              <div class="text-secondary small">{{ t.hint }}</div>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
  <p class="text-secondary small mt-4 mb-0">
    Estas cifras ayudan a fijar el precio y el límite diario del asesor. El costo de la IA se calcula con los tokens que
    reporta el modelo.
  </p>
}
