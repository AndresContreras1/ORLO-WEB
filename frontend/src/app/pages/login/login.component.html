<main class="min-vh-100 d-flex align-items-center justify-content-center p-3">
  <div class="card border-0 w-100" style="max-width: 24rem;">
    <div class="card-body p-4">
      <a routerLink="/" class="text-decoration-none text-body fw-bold fs-4">ORLO</a>
      <h1 class="h5 mt-3 mb-1">Entra al panel</h1>
      <p class="text-secondary small mb-4">Para el equipo de ORLO.</p>

      @if (sesionExpirada && !error()) {
        <div class="alert alert-light border small">Tu sesión terminó. Vuelve a entrar.</div>
      }
      @if (error()) {
        <div class="alert alert-danger small" id="errorLogin">{{ error() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="entrar()" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Correo</label>
          <input id="email" type="email" class="form-control" formControlName="email" autocomplete="username"
                 [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid">
          <app-field-error [control]="form.controls.email" />
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group">
            <input id="password" [type]="verPassword() ? 'text' : 'password'" class="form-control"
                   formControlName="password" autocomplete="current-password"
                   [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid">
            <button type="button" class="btn btn-outline-secondary" (click)="verPassword.set(!verPassword())"
                    [attr.aria-label]="verPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <i class="bi" [class.bi-eye]="!verPassword()" [class.bi-eye-slash]="verPassword()"></i>
            </button>
          </div>
          <app-field-error [control]="form.controls.password" />
        </div>
        <button type="submit" class="btn btn-primary w-100" id="btnEntrar" [disabled]="enviando()">
          {{ enviando() ? 'Entrando…' : 'Entrar' }}
        </button>
      </form>
    </div>
  </div>
</main>
